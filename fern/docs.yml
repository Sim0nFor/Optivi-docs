# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: optivi.docs.buildwithfern.com
    # custom-domain: docs.optivi.xyz # uncomment when switching the domain from GitBook

title: Optivi Docs

layout:
  searchbar-placement: header
  page-width: full

navigation:
  - section: Quick Access
    contents:
      - link: Website
        href: https://optivi.xyz
        icon: fa-duotone fa-globe
      - link: Platform
        href: https://app.optivi.xyz
        icon: fa-duotone fa-arrow-up-right-from-square
      - link: X/Twitter
        href: https://x.com/optivixyz
        icon: fa-brands fa-x-twitter
  - section: Optivi Protocol
    contents:
      - page: About Optivi
        path: docs/pages/about-optivi.mdx
        icon: fa-duotone fa-circle-info
      - page: Onboarding
        path: docs/pages/onboarding.mdx
        icon: fa-duotone fa-wallet
      - page: Fees
        path: docs/pages/fees.mdx
        icon: fa-duotone fa-receipt
      - page: Managing Positions
        path: docs/pages/managing-positions.mdx
        icon: fa-duotone fa-chart-line
  - section: Guidebook
    contents:
      - page: Learn
        path: docs/pages/learn.mdx
        icon: fa-duotone fa-graduation-cap

navbar-links:
  - type: filled
    text: Platform
    url: https://app.optivi.xyz

colors:
  accent-primary:
    dark: "#6FEAFE"
    light: "#0E7490"
  background:
    dark: "#010814"
    light: "#FFFFFF"
  border:
    dark: "#1F2C3A"
    light: "#E2E8F0"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/logo-dark.png
  light: docs/assets/logo-light.png
  height: 24
  href: https://optivi.xyz

favicon: docs/assets/favicon.png

metadata:
  og:dynamic: true
